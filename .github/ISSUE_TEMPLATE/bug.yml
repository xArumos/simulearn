name: Bug
description: Something is broken or behaves wrongly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: This repo is **public**. Never paste CHILDES transcript text, tokens or passwords here; describe the input instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include short error messages or log lines.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      placeholder: "1. python -m src.eval.evaluate --config ...\n2. ..."
  - type: input
    id: where
    attributes:
      label: Where
      description: Machine / HiPerGator / HF Space, and the branch or commit.
  - type: checkboxes
    id: safety
    attributes:
      label: Data check
      options:
        - label: This issue contains no CHILDES text, tokens or passwords.
          required: true
