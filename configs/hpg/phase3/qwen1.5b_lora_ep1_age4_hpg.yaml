run_name: qwen1.5b_lora_ep1_age4_hpg
hypothesis: 'Phase 3 age-4 adapter on HiPerGator: run 3 (qwen1.5b_lora_ep1_hpg) unchanged
  except the bucket (48-59 months), age_label and run_name. Same recipe as
  configs/phase3/qwen1.5b_lora_ep1_age4.yaml, whose local run was stopped at ~step 150.'
age_label: 4
model:
  name: Qwen/Qwen2.5-1.5B-Instruct
  load_in_4bit: false
  dtype: bfloat16
  adapter: null
data:
  processed_dir: data/processed
  bucket: age4
  context_turns: 6
  max_train_examples: null
  max_val_examples: 1000
  sample_seed: 42
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear
train:
  lr: 0.0002
  epochs: 1
  scheduler: cosine
  warmup: 0.03
  per_device_batch_size: 8
  grad_accum: 2
  max_length: 512
  gradient_checkpointing: true
  evals_per_epoch: 4
  early_stopping_patience: 3
  save_total_limit: 3
  logging_steps: 10
  seed: 42
eval:
  split: val
  max_examples: 1000
  sample_seed: 42
  prompt_variant: default
  temperature: 0.7
  top_p: 0.9
  max_new_tokens: 60
  seed: 1234
  batch_size: 64
  max_length: 512
  compute_loss: true
  loss_batch_size: 4
