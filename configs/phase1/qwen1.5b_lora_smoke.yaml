run_name: qwen1.5b_lora_smoke
hypothesis: 'Smoke test: loss decreases, masking is right, no OOM, samples are not
  garbage.'
age_label: 5
model:
  name: Qwen/Qwen2.5-1.5B-Instruct
  load_in_4bit: false
  dtype: bfloat16
  adapter: null
data:
  processed_dir: data/processed
  bucket: age5
  context_turns: 6
  max_train_examples: 200
  max_val_examples: 100
  sample_seed: 42
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear
train:
  lr: 0.0002
  epochs: 2
  scheduler: cosine
  warmup: 0.03
  per_device_batch_size: 4
  grad_accum: 1
  max_length: 512
  gradient_checkpointing: true
  evals_per_epoch: 4
  early_stopping_patience: null
  save_total_limit: 3
  logging_steps: 5
  seed: 42
  max_steps: 60
  eval_steps: 20
eval:
  split: val
  max_examples: 100
  sample_seed: 42
  prompt_variant: default
  temperature: 0.7
  top_p: 0.9
  max_new_tokens: 60
  seed: 1234
  batch_size: 64
  max_length: 512
  compute_loss: true
  loss_batch_size: 4
