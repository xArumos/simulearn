# Local MongoDB for demo chats, ratings and the transcript API (issue #13).
#   docker compose up -d      start (data survives restarts in the named volume)
#   docker compose stop       stop
#   docker compose down       stop and remove the container; the data volume stays
# The port is bound to 127.0.0.1 only: nothing outside this machine can reach the database,
# which is why it runs without a password. Do not change the binding to 0.0.0.0.
# Backups: bash scripts/db_backup.sh (README "Local MongoDB").
services:
  mongo:
    image: mongo:7.0
    container_name: simulearn-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - simulearn-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  simulearn-mongo-data:
