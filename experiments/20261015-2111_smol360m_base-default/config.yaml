run_name: smol360m_base-default
hypothesis: 'Baseline (no fine-tuning), default system prompt. Expected: replies longer
  and more adult-like than real 5-year-olds.'
age_label: 5
model:
  name: HuggingFaceTB/SmolLM2-360M-Instruct
  adapter: null
  load_in_4bit: false
  dtype: bfloat16
data:
  processed_dir: data/processed
  bucket: age5
eval:
  split: val
  max_examples: 1000
  sample_seed: 42
  prompt_variant: default
  temperature: 0.7
  top_p: 0.9
  max_new_tokens: 60
  seed: 1234
  batch_size: 64
  max_length: 512
  compute_loss: true
  loss_batch_size: 4
