run_name: age6_smol360m_base-strong_cpu
hypothesis: 'Baseline (no training), strong prompt, SmolLM2-360M on age-6 val: the
  bar the CPU-trained model must beat.'
age_label: 6
model:
  name: HuggingFaceTB/SmolLM2-360M-Instruct
  adapter: null
  load_in_4bit: false
  dtype: float32
  device_map: cpu
data:
  processed_dir: data/processed_all
  bucket: age6
eval:
  split: val
  max_examples: 1000
  sample_seed: 42
  prompt_variant: strong
  temperature: 0.7
  top_p: 0.9
  max_new_tokens: 60
  seed: 1234
  batch_size: 16
  max_length: 512
  compute_loss: true
  loss_batch_size: 2
